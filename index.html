<!doctype html><html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PIXEL BATTLE STG v10</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#05070c;color:#fff;overflow:hidden;font-family:system-ui}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
#box{width:min(100vw,56.25vh)}
canvas{display:block;width:100%;aspect-ratio:360/640;background:#07101b;image-rendering:pixelated;touch-action:none}
#controls{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px}
button{height:52px;background:#102033;color:#fff;border:2px solid #46708c;border-radius:8px;font:bold 14px monospace;touch-action:none}
</style></head><body><div id="wrap"><div id="box">
<canvas id="game" width="360" height="640"></canvas>
<div id="controls"><button id="shot">SHOT</button><button id="laser">LASER</button>
<button id="bomb">BOMB</button><button id="od">OVERDRIVE</button></div>
</div></div>
<script>
"use strict";
const c=document.getElementById("game"),g=c.getContext("2d"),W=360,H=640;
g.imageSmoothingEnabled=false;
let started=false,over=false,drag=false,tx=180,ty=550,frame=0,score=0,lives=3,bombs=3,weapon="shot";
const p={x:180,y:550,inv:0,od:0},shots=[],en=[],eb=[];
function start(){started=true;over=false;frame=0;score=0;lives=3;bombs=3;weapon="shot";
p.x=180;p.y=550;p.inv=45;p.od=0;tx=180;ty=550;shots.length=0;en.length=0;eb.length=0}
function player(){const X=Math.round(p.x),Y=Math.round(p.y);
g.fillStyle="#fff";g.fillRect(X-2,Y-24,4,6);g.fillRect(X-15,Y-8,30,7);
g.fillStyle="#18ddff";g.fillRect(X-8,Y-17,16,23);g.fillRect(X-18,Y-4,36,7);
g.fillStyle="#cfffff";g.fillRect(X-3,Y-20,6,10);
g.fillStyle="#1768b5";g.fillRect(X-3,Y-12,6,6);
g.fillStyle="#63adff";g.fillRect(X-16,Y-2,7,4);g.fillRect(X+9,Y-2,7,4);
g.fillStyle="#fff36b";g.fillRect(X-7,Y+5,5,9);g.fillRect(X+2,Y+5,5,9);
g.strokeStyle="#fff";g.lineWidth=2;g.strokeRect(X-19,Y-24,38,39)}
function move(e){const r=c.getBoundingClientRect();tx=(e.clientX-r.left)*W/r.width;ty=(e.clientY-r.top)*H/r.height}
function shoot(){if(weapon==="shot"){shots.push({x:p.x-6,y:p.y-22,vy:-8});shots.push({x:p.x+6,y:p.y-22,vy:-8})}
else shots.push({x:p.x,y:p.y-25,vy:-10,laser:true})}
function spawn(){en.push({x:20+Math.random()*320,y:-15,hp:1+Math.floor(Math.random()*3),vy:1})}
function update(){if(!started||over)return;frame++;if(p.inv>0)p.inv--;if(p.od>0)p.od--;
p.x+=(tx-p.x)*.3;p.y+=(ty-p.y)*.3;p.x=Math.max(20,Math.min(340,p.x));p.y=Math.max(35,Math.min(605,p.y));
if(frame%8===0)shoot();if(frame%80===0)spawn();
en.forEach(e=>{e.y+=e.vy;if(frame%70===0){const dx=p.x-e.x,dy=p.y-e.y,l=Math.hypot(dx,dy)||1;
eb.push({x:e.x,y:e.y,vx:dx/l*2,vy:dy/l*2})}});
shots.forEach(s=>s.y+=s.vy);eb.forEach(b=>{b.x+=b.vx;b.y+=b.vy});
shots.forEach(s=>en.forEach(e=>{if(e.hp>0&&Math.hypot(s.x-e.x,s.y-e.y)<12){e.hp--;s.y=-100;if(e.hp<=0)score+=100}}));
eb.forEach(b=>{if(Math.hypot(b.x-p.x,b.y-p.y)<9&&p.inv<=0&&p.od<=0){lives--;p.inv=90;if(lives<=0)over=true}});
for(let i=en.length-1;i>=0;i--)if(en[i].hp<=0||en[i].y>670)en.splice(i,1);
for(let i=shots.length-1;i>=0;i--)if(shots[i].y<-30)shots.splice(i,1);
for(let i=eb.length-1;i>=0;i--)if(eb[i].x<-30||eb[i].x>390||eb[i].y<-30||eb[i].y>670)eb.splice(i,1)}
function draw(){g.fillStyle="#07101b";g.fillRect(0,0,W,H);g.fillStyle="#10243a";
for(let y=0;y<H;y+=32)g.fillRect(0,y,W,1);
g.fillStyle="#fff";g.font="bold 12px monospace";g.textAlign="left";
g.fillText("PIXEL BATTLE STG",8,18);g.fillText("SCORE "+score,8,36);g.fillText("LIFE "+lives+"  BOMB "+bombs,8,54);
eb.forEach(b=>{g.fillStyle="#ff5264";g.fillRect(b.x-4,b.y-4,8,8)});
shots.forEach(s=>{g.fillStyle=s.laser?"#fff":"#7ff7ff";g.fillRect(s.x-2,s.y-7,4,10)});
en.forEach(e=>{g.fillStyle="#ff5b6c";g.fillRect(e.x-8,e.y-5,16,10);g.fillRect(e.x-4,e.y-9,8,18)});
if(!started){g.fillStyle="rgba(0,0,0,.82)";g.fillRect(0,0,W,H);g.fillStyle="#fff";g.textAlign="center";
g.font="bold 25px monospace";g.fillText("PIXEL BATTLE STG",180,230);g.fillStyle="#7ff7ff";
g.font="bold 18px monospace";g.fillText("TAP TO START",180,310)}
else if(p.inv===0||p.inv%6<3)player();
if(over){g.fillStyle="rgba(0,0,0,.75)";g.fillRect(0,0,W,H);g.fillStyle="#fff";g.textAlign="center";
g.font="bold 28px monospace";g.fillText("GAME OVER",180,290);g.font="14px monospace";g.fillText("TAP TO RETRY",180,320)}
requestAnimationFrame(draw)}
c.addEventListener("pointerdown",e=>{e.preventDefault();if(!started||over){start();return}drag=true;move(e)});
c.addEventListener("pointermove",e=>{if(drag)move(e)});c.addEventListener("pointerup",()=>drag=false);c.addEventListener("pointercancel",()=>drag=false);
document.getElementById("shot").onpointerdown=e=>{e.preventDefault();if(!started||over)start();else weapon="shot"};
document.getElementById("laser").onpointerdown=e=>{e.preventDefault();if(!started||over)start();else weapon="laser"};
document.getElementById("bomb").onpointerdown=e=>{e.preventDefault();if(!started||over)start();else if(bombs){bombs--;p.inv=60;eb.length=0}};
document.getElementById("od").onpointerdown=e=>{e.preventDefault();if(!started||over)start();else{p.od=600;p.inv=20}};
setInterval(update,1000/60);draw();
</script></body></html>
